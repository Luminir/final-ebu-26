<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bgNh" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fdfbf7"/><stop offset="100%" stop-color="#f1e5d3"/></radialGradient>
    <linearGradient id="stick" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#b07d4b"/><stop offset="50%" stop-color="#d4a373"/><stop offset="100%" stop-color="#8c5828"/></linearGradient>
    <linearGradient id="urn" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ffd56b"/><stop offset="50%" stop-color="#c69214"/><stop offset="100%" stop-color="#7a5500"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="300" height="240" rx="16" fill="url(#bgNh)"/>
  <!-- Smoke waves -->
  <path d="M145 80 Q130 50 150 30 T135 10" stroke="#c4b5a0" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M152 75 Q165 45 145 25 T160 5" stroke="#c4b5a0" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- Incense Sticks -->
  <g stroke-linecap="round">
    <line x1="140" y1="160" x2="140" y2="70" stroke="url(#stick)" stroke-width="3.5"/>
    <line x1="150" y1="160" x2="150" y2="65" stroke="url(#stick)" stroke-width="3.5"/>
    <line x1="160" y1="160" x2="160" y2="72" stroke="url(#stick)" stroke-width="3.5"/>
    <!-- Glowing Tips -->
    <circle cx="140" cy="70" r="3" fill="#ff4500" filter="url(#glow)"/>
    <circle cx="150" cy="65" r="3.5" fill="#ff3300" filter="url(#glow)"/>
    <circle cx="160" cy="72" r="3" fill="#ff4500" filter="url(#glow)"/>
  </g>
  <!-- Brass Burner Urn -->
  <ellipse cx="150" cy="185" rx="55" ry="12" fill="rgba(0,0,0,0.12)"/>
  <path d="M115 155 C115 190 185 190 185 155 C185 145 115 145 115 155 Z" fill="url(#urn)"/>
  <ellipse cx="150" cy="150" rx="35" ry="8" fill="#e5b839"/>
  <ellipse cx="150" cy="150" rx="30" ry="6" fill="#8c6200"/>
  <!-- Incense Box on Table -->
  <rect x="40" y="165" width="60" height="26" rx="4" fill="#a44238" transform="rotate(-10 40 165)"/>
  <rect x="42" y="167" width="56" height="8" rx="2" fill="#e5a93b" transform="rotate(-10 40 165)"/>
  <text x="150" y="230" font-family="'Be Vietnam Pro',sans-serif" font-size="12" font-weight="700" fill="#2d4a3e" text-anchor="middle">Nhang Trầm Hương Bài Thảo Mộc Tự Nhiên</text>
</svg>