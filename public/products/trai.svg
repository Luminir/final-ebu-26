<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bgTr" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fffcf5"/><stop offset="100%" stop-color="#faebd7"/></radialGradient>
    <linearGradient id="pomelo" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c4e538"/><stop offset="70%" stop-color="#a3cb38"/><stop offset="100%" stop-color="#009432"/></linearGradient>
    <radialGradient id="apple" cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#ff6b6b"/><stop offset="70%" stop-color="#ee5253"/><stop offset="100%" stop-color="#b33939"/></radialGradient>
    <radialGradient id="orange" cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#feca57"/><stop offset="70%" stop-color="#ff9f43"/><stop offset="100%" stop-color="#e67e22"/></radialGradient>
    <linearGradient id="banana" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#78e08f"/><stop offset="60%" stop-color="#38ada9"/><stop offset="100%" stop-color="#079992"/></linearGradient>
    <linearGradient id="plate" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#dcdde1"/></linearGradient>
  </defs>
  <rect width="300" height="240" rx="16" fill="url(#bgTr)"/>
  <!-- Plate Shadow & Base -->
  <ellipse cx="150" cy="190" rx="100" ry="24" fill="rgba(0,0,0,0.1)"/>
  <ellipse cx="150" cy="185" rx="90" ry="20" fill="url(#plate)" stroke="#c8d6e5" stroke-width="2"/>
  <ellipse cx="150" cy="183" rx="80" ry="16" fill="#f5f6fa"/>
  <!-- Green Banana Bunch (Base of standard Vietnamese ngũ quả) -->
  <path d="M70 170 C80 130 140 135 150 165 C160 135 220 130 230 170 C200 185 100 185 70 170 Z" fill="url(#banana)"/>
  <!-- Center Big Green Pomelo -->
  <circle cx="150" cy="115" r="42" fill="url(#pomelo)"/>
  <circle cx="150" cy="74" r="3" fill="#2d3436"/>
  <!-- Red Apple Left -->
  <circle cx="105" cy="135" r="26" fill="url(#apple)"/>
  <path d="M105 110 Q112 105 115 115" stroke="#574b90" stroke-width="2" fill="none"/>
  <!-- Orange Fruit Right -->
  <circle cx="195" cy="135" r="26" fill="url(#orange)"/>
  <!-- Dragonfruit / Mango on top -->
  <path d="M135 90 C125 60 165 50 165 90 Z" fill="#eb4d4b"/>
  <path d="M150 65 Q160 55 170 60" stroke="#6ab04c" stroke-width="3" fill="none"/>
  <text x="150" y="228" font-family="'Be Vietnam Pro',sans-serif" font-size="12" font-weight="700" fill="#2d4a3e" text-anchor="middle">Mâm Ngũ Quả Tươi Chuẩn Phong Thủy</text>
</svg>