<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bgNe" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff8f5"/><stop offset="100%" stop-color="#fae3dc"/></radialGradient>
    <linearGradient id="wax" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#e74c3c"/><stop offset="50%" stop-color="#ff7675"/><stop offset="100%" stop-color="#c0392b"/></linearGradient>
    <radialGradient id="flame" cx="50%" cy="80%" r="70%"><stop offset="0%" stop-color="#ffffff"/><stop offset="30%" stop-color="#f1c40f"/><stop offset="80%" stop-color="#e67e22"/><stop offset="100%" stop-color="#d35400"/></radialGradient>
    <filter id="flameGlow"><feGaussianBlur stdDeviation="4" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="300" height="240" rx="16" fill="url(#bgNe)"/>
  <!-- Left Candle -->
  <g transform="translate(85, 30)">
    <!-- Base -->
    <ellipse cx="30" cy="165" rx="24" ry="7" fill="rgba(0,0,0,0.12)"/>
    <path d="M15 155 L45 155 L42 165 L18 165 Z" fill="#d4af37"/>
    <!-- Wax Cylinder -->
    <rect x="20" y="70" width="20" height="90" rx="3" fill="url(#wax)"/>
    <ellipse cx="30" cy="70" rx="10" ry="3.5" fill="#ff7675"/>
    <!-- Wick & Flame -->
    <line x1="30" y1="70" x2="30" y2="58" stroke="#2c3e50" stroke-width="2"/>
    <path d="M30 35 C22 48 24 58 30 58 C36 58 38 48 30 35 Z" fill="url(#flame)" filter="url(#flameGlow)"/>
  </g>
  <!-- Right Candle -->
  <g transform="translate(155, 30)">
    <!-- Base -->
    <ellipse cx="30" cy="165" rx="24" ry="7" fill="rgba(0,0,0,0.12)"/>
    <path d="M15 155 L45 155 L42 165 L18 165 Z" fill="#d4af37"/>
    <!-- Wax Cylinder -->
    <rect x="20" y="70" width="20" height="90" rx="3" fill="url(#wax)"/>
    <ellipse cx="30" cy="70" rx="10" ry="3.5" fill="#ff7675"/>
    <!-- Wick & Flame -->
    <line x1="30" y1="70" x2="30" y2="58" stroke="#2c3e50" stroke-width="2"/>
    <path d="M30 35 C22 48 24 58 30 58 C36 58 38 48 30 35 Z" fill="url(#flame)" filter="url(#flameGlow)"/>
  </g>
  <text x="150" y="228" font-family="'Be Vietnam Pro',sans-serif" font-size="12" font-weight="700" fill="#2d4a3e" text-anchor="middle">Cặp Nến Sen Đỏ Sáp Ong Chống Khói</text>
</svg>