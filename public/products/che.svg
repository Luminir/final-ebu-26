<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bgCh" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fffef8"/><stop offset="100%" stop-color="#f7f1db"/></radialGradient>
    <linearGradient id="soup" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fff176"/><stop offset="100%" stop-color="#fbc02d"/></linearGradient>
  </defs>
  <rect width="300" height="240" rx="16" fill="url(#bgCh)"/>
  <!-- Tray shadow -->
  <ellipse cx="150" cy="185" rx="95" ry="20" fill="rgba(0,0,0,0.1)"/>
  <!-- 3 Bowls of sweet bean soup -->
  <!-- Left Bowl -->
  <g transform="translate(60, 95)">
    <ellipse cx="35" cy="65" rx="28" ry="8" fill="rgba(0,0,0,0.1)"/>
    <path d="M12 40 C12 65 58 65 58 40 Z" fill="#ffffff" stroke="#e0e0e0"/>
    <ellipse cx="35" cy="40" rx="22" ry="7" fill="url(#soup)"/>
    <circle cx="35" cy="39" r="4" fill="#ffffff" opacity="0.8"/>
  </g>
  <!-- Center Main Bowl -->
  <g transform="translate(115, 105)">
    <ellipse cx="35" cy="65" rx="30" ry="9" fill="rgba(0,0,0,0.15)"/>
    <path d="M10 40 C10 68 60 68 60 40 Z" fill="#ffffff" stroke="#dcdcdc"/>
    <ellipse cx="35" cy="40" rx="24" ry="8" fill="url(#soup)"/>
    <circle cx="35" cy="39" r="5" fill="#ffffff" opacity="0.8"/>
  </g>
  <!-- Right Bowl -->
  <g transform="translate(170, 95)">
    <ellipse cx="35" cy="65" rx="28" ry="8" fill="rgba(0,0,0,0.1)"/>
    <path d="M12 40 C12 65 58 65 58 40 Z" fill="#ffffff" stroke="#e0e0e0"/>
    <ellipse cx="35" cy="40" rx="22" ry="7" fill="url(#soup)"/>
    <circle cx="35" cy="39" r="4" fill="#ffffff" opacity="0.8"/>
  </g>
  <text x="150" y="228" font-family="'Be Vietnam Pro',sans-serif" font-size="12" font-weight="700" fill="#2d4a3e" text-anchor="middle">Bộ 3 Chén Chè Đậu Xanh Nấu Nước Cốt Dừa</text>
</svg>